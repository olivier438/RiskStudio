# Weekly dependency updates (CRA Annex I: no known exploitable vulnerability).
# Security updates are raised as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: composer
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      svelte:
        patterns: ["svelte", "@sveltejs/*", "svelte-check"]
      tooling:
        patterns: ["vite", "typescript"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
